<div id="shell">
 <header id="top" class="row">
  <button id="recent" class="host-tool glyph" title="最近成功打开的应用">&#xE70D;</button><div id="tabs"></div>
  <button id="tab-more" class="host-tool glyph" title="当前打开的标签" style="display:none">&#xE712;</button>

   <button id="window-close" class="window-button glyph" title="关闭宿主">&#xE8BB;</button></div>
 </header>
 <div id="menu-row"><div id="app-menus"></div><button id="menu" class="host-tool glyph" title="宿主选项">&#xE712;</button></div>
 <main id="body">

   <span class="muted">打开 .uapp 应用包，在标签间切换。应用自行选择原生、OpenGL 或 Web 内容。</span>
   <button id="empty-open" class="primary" style="width:160px">打开应用包</button>
  </div><div id="app-chrome"></div></section>
  <aside id="assistant" class="column">

   <span class="label">目标实例</span><button id="target">选择应用</button>
   <span class="label">语义命令</span><button id="command">选择命令</button>

   <div id="actions" class="row"><button id="invoke" class="primary">执行操作</button><button id="cancel">取消任务</button></div>
   <span class="label">执行状态</span><div id="result">选择目标和操作后执行。</div>
   <button id="advanced-toggle">高级：参数、事务与详细记录 ▸</button>
   <div id="advanced" class="column">
    <button id="snapshot">查看状态快照</button><div id="transactions" class="row">

    <span class="label">详细结果 / 进度 / 事件</span><textarea id="log" readonly="readonly"></textarea>
   </div>
  </aside>
 </main>
</div>
