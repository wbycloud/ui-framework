<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin:0; font-family:"Microsoft YaHei UI"; font-size:14px; color:#243047; background:#f4f6fa; }
button { height:30px; padding:5px 10px; border:1px solid #dce2ec; border-radius:6px; background:#ffffff; color:#34425b; }
button:hover { background:#e8eef8; }
button:focus { border-color:#3674d9; }
button:disabled { color:#8a93a2; background:#edf0f5; }
.row { display:flex; flex-direction:row; gap:6px; align-items:center; }
.column { display:flex; flex-direction:column; gap:8px; }
.muted { color:#748098; font-size:12px; }
.label { color:#64718a; font-size:12px; }
.primary { background:#3674d9; color:#ffffff; border-color:#3674d9; }
.active { background:#e7eefb; border-color:#7b9fdc; color:#254f91; }
.chrome { background:#ffffff; border:1px solid #e1e6ef; }
.panel-title { height:28px; padding:4px 8px; display:flex; flex-direction:row; gap:4px; align-items:center; background:#eaf0f8; }
.panel-title button { height:22px; padding:1px 5px; font-size:12px; }
input, textarea { padding:6px; background:#ffffff; border:1px solid #dce2ec; border-radius:5px; color:#243047; font-size:13px; }
textarea { width:100%; }
#shell { display:flex; flex-direction:column; width:100%; height:100%; }
#top { height:44px; padding:6px 8px; background:#edf1f7; gap:6px; }
#menu, #theme { width:32px; padding:4px; }
#open { width:88px; }
#assistant-toggle { width:36px; padding:4px; }
#tabs { display:flex; flex-direction:row; flex:1; gap:4px; overflow-x:auto; height:32px; }
.tab { display:flex; flex-direction:row; gap:2px; }
.tab-name { width:150px; height:30px; }
.tab-close { width:26px; height:30px; padding:4px; }
#body { display:flex; flex-direction:row; flex:1; }
#workspace { flex:1; height:100%; position:relative; overflow:hidden; background:#f4f6fa; }
#empty { padding:48px 28px; gap:14px; }
#empty-title { font-size:26px; color:#2f425f; }
#app-chrome { position:absolute; left:0; top:0; width:100%; height:100%; }
#assistant { width:320px; height:100%; padding:12px; gap:8px; background:#ffffff; border-left:1px solid #dce2ec; overflow-y:auto; }
#assistant-title { font-size:16px; }
#target, #command { width:100%; text-align:left; }
#schema { height:56px; font-size:12px; }
#params { height:66px; }
#actions button { flex:1; }
#transactions button { flex:1; padding:4px 2px; font-size:12px; }
#log { height:200px; font-size:12px; }
#popup { width:100%; height:100%; padding:12px; gap:8px; background:#ffffff; overflow-y:auto; }
#popup-title { font-size:16px; }
#popup-detail { max-height:160px; overflow-y:auto; }
#popup-items { gap:4px; }
#popup-items button { text-align:left; width:100%; }
.dark { background:#1c2230; color:#dbe4f2; }
.dark button, .dark input, .dark textarea { background:#283244; border-color:#3e4b60; color:#dbe4f2; }
.dark button:hover { background:#34435b; }
.dark .primary { background:#467fd9; color:#ffffff; }
.dark .active { background:#354866; border-color:#6589c0; }
.dark .chrome, .dark #assistant, .dark #popup { background:#222b3b; border-color:#3e4b60; }
.dark #top, .dark .panel-title { background:#283244; }
.dark #workspace { background:#1c2230; }
.dark .muted, .dark .label { color:#a4b2ca; }
.dark #empty-title { color:#dbe4f2; }
.menu-strip { gap:0; padding:0 4px; border:0; background:#f4f6fa; }
.app-menu { height:26px; padding:3px 8px; border:0; border-radius:0; background:#f4f6fa; color:#243047; align-items:center; }
.app-menu:hover,.app-menu:focus,.app-menu.expanded { background:#dce8fa; color:#254f91; }
.app-menu:disabled { color:#8a93a2; background:#f4f6fa; }
.host-tool,.app-tool { border:0; border-radius:3px; background:#edf1f7; }
.app-tool { background:#ffffff; }
.host-tool:hover,.host-tool:focus,.app-tool:hover,.app-tool:focus { background:#dce8fa; }
.tab-name { border-radius:6px; }
.tab-close { border-radius:6px; }
.dark .menu-strip,.dark .app-menu { background:#222b3b; color:#dbe4f2; border:0; }
.dark .app-menu:hover,.dark .app-menu:focus,.dark .app-menu.expanded { background:#354866; }
.dark .app-menu:disabled { color:#8290a7; background:#222b3b; }
.dark .host-tool { background:#283244; border:0; }.dark .app-tool { background:#222b3b; border:0; }
.dark .host-tool:hover,.dark .host-tool:focus,.dark .app-tool:hover,.dark .app-tool:focus { background:#354866; }
#popup.popup-menu { padding:4px; gap:0; }#popup.popup-menu #popup-title,#popup.popup-menu #popup-detail,#popup.popup-menu #popup-actions { display:none; }
#popup.popup-menu #popup-items { gap:0; }#popup.popup-menu .popup-menu-row { height:28px; padding:3px 8px; border:0; border-radius:0; background:#ffffff; }
.dark #popup.popup-menu .popup-menu-row { background:#222b3b; }.dark #popup.popup-menu .popup-menu-row:hover,.dark #popup.popup-menu .popup-menu-row:focus { background:#354866; }
.popup-shortcut { color:#65738a; font-size:12px; }.dark .popup-shortcut { color:#a4b2ca; }
#popup.popup-menu .popup-menu-row:hover,#popup.popup-menu .popup-menu-row:focus { background:#e4edf9; }
@media (max-width:799px) { #assistant { display:none; } }
</style></head><body>
<div id="shell">
 <header id="top" class="row">
  <button id="menu" class="host-tool" title="框架菜单">☰</button><div id="tabs"></div>
  <button id="open" class="host-tool" title="打开应用包 · Ctrl+Shift+O">＋ 打开</button>
  <button id="assistant-toggle" class="host-tool" title="助手命令及状态">AI</button>
  <button id="theme" class="host-tool" title="浅色 / 深色主题">◐</button>
  <button id="layout-reset" class="host-tool" title="重置当前应用布局">↺</button>
 </header>
 <main id="body">
  <section id="workspace"><div id="empty" class="column"><span id="empty-title">你的应用工作区</span>
   <span class="muted">打开 .uapp 应用包，在标签间切换。应用自行选择原生、OpenGL 或 Web 内容。</span>
   <button id="empty-open" class="primary" style="width:160px">打开应用包</button>
  </div><div id="app-chrome"></div></section>
  <aside id="assistant" class="column">
   <div id="assistant-title">助手工作台</div><span class="muted">调用固定目标实例；切换标签不会改变任务目标。</span>
   <span class="label">目标实例</span><button id="target">选择应用</button>
   <span class="label">语义命令</span><button id="command">选择命令</button>
   <textarea id="schema" readonly="readonly"></textarea><span class="label">参数 · JSON</span>
   <textarea id="params">{}</textarea><div id="actions" class="row">
    <button id="invoke" class="primary">调用</button><button id="cancel">取消任务</button></div>
   <button id="snapshot">查看状态快照</button><div id="transactions" class="row">
    <button id="begin">开始</button><button id="commit">提交</button>
    <button id="rollback">回滚</button><button id="undo">撤销</button></div>
   <span class="label">结果 / 进度 / 事件</span><textarea id="log" readonly="readonly"></textarea>
  </aside>
 </main>
</div>
<div id="popup" class="column" style="display:none"><div id="popup-title"></div>
 <div id="popup-detail" class="muted"></div><div id="popup-items" class="column"></div>
 <div id="popup-actions" class="row"></div></div>
<script>
(function () {
 var model = null, popupToken = '', dark = false;
 function element(id) { return document.getElementById(id); }
 function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  var b = document.createElement('button'); b.id = id; b.textContent = title;
  if (style) b.className = style;
  b.addEventListener('click', function () { send(action, extra); }); return b;
 }
 function action(id, name) { element(id).addEventListener('click', function () { send(name); }); }
 function setTheme(value) { dark = !!value; document.body.className = dark ? 'dark' : ''; }
 action('menu', 'menu'); action('open', 'open'); action('empty-open', 'open');
 action('assistant-toggle', 'assistant'); action('theme', 'theme');
 element('layout-reset').addEventListener('click',function(){send('layout-reset',{id:model.active})});
 action('target', 'targets'); action('command', 'commands');
 action('invoke', 'invoke'); action('cancel', 'cancel'); action('snapshot', 'snapshot');
 action('begin', 'begin'); action('commit', 'commit'); action('rollback', 'rollback'); action('undo', 'undo');
 element('params').addEventListener('input', function () { send('params', {params:element('params').value}); });
 function place(node, rect) {
  node.style.position='absolute'; node.style.left=rect.x+'px'; node.style.top=rect.y+'px';
  node.style.width=rect.width+'px'; node.style.height=rect.height+'px';
 }
 var chromeNodes={},tabNodes={};
 function keep(root,map,key,make){var n=map[key];if(!n){n=make();map[key]=n;}root.appendChild(n);return n;}
 function prune(root,map,live){for(var k in map)if(!live[k]){root.removeChild(map[k]);delete map[k];}}
 function paintChrome(state) {

  for(var old in chromeNodes)if(old.indexOf(':panel:')>=0&&old.indexOf(state.active+':panel:')!==0){root.removeChild(chromeNodes[old]);delete chromeNodes[old];}
  var menu=keep(root,chromeNodes,'menu',function(){var n=document.createElement('div');n.className='row menu-strip';n.items={};return n;});live.menu=true;place(menu,state.menuRect);if(menu.instance!==state.active){if(menu.more){menu.removeChild(menu.more);menu.more=null}menu.instance=state.active}var menuLive={},used=0,menuOverflow=false;menu.groups=state.menuGroups||[];menu.target=state.active;for(var prior in menu.items)if(prior.indexOf(state.active+':')!==0){menu.removeChild(menu.items[prior]);delete menu.items[prior]}
  for(var g=0;g<(state.menuGroups||[]).length;g++){var group=state.menuGroups[g],key=state.active+':'+group.path;menuLive[key]=true;
   var item=keep(menu,menu.items,key,function(){var n=button('app-menu-'+group.key,group.title,'app-menu',{id:state.active,menu:group.path,panel:'app-menu-'+group.key},'app-menu');n.addEventListener('mouseenter',function(){send('app-menu-hover',{id:model.active,menu:n.group.path,panel:n.id})});n.addEventListener('keydown',function(e){if(e.keyCode===37||e.keyCode===39){e.preventDefault();var at=menu.groups.indexOf(n.group),next=(at+menu.groups.length+(e.keyCode===37?-1:1))%menu.groups.length;var group=menu.groups[next];send('app-menu',{id:menu.target,menu:group.path,panel:n.id})}});return n;});item.group=group;item.textContent=group.title;item.className='app-menu'+(state.menuOpen===group.path?' expanded':'');
   var width=Math.max(48,Math.min(220,group.title.length*14+16));item.style.width=width+'px';item.style.display=used+width+76<=state.menuRect.width?'flex':'none';if(item.style.display==='flex')used+=width;else menuOverflow=true;
  }prune(menu,menu.items,menuLive);if(!menu.more){menu.more=button('menu-more','更多 ▾','menu-more',{id:state.active,panel:'menu-more'},'app-menu');menu.more.addEventListener('mouseenter',function(){send('app-menu-hover',{id:model.active,menu:'',panel:'menu-more'})});menu.appendChild(menu.more)}menu.more.className='app-menu'+(state.menuOpen===''?' expanded':'');menu.more.style.width='70px';menu.more.style.display=menuOverflow?'flex':'none';menu.appendChild(menu.more);
  var tools=keep(root,chromeNodes,'tools',function(){var n=document.createElement('div');n.className='row chrome';n.items={};return n;});live.tools=true;place(tools,state.toolbarRect);if(tools.instance!==state.active){if(tools.more){tools.removeChild(tools.more);tools.more=null}tools.instance=state.active}var alive={},toolWidth=0,lastGroup='',overflow=false;
  for(var previous in tools.items)if(previous.indexOf(state.active+':')!==0){tools.removeChild(tools.items[previous]);delete tools.items[previous];}
  for(var i=0;i<state.tools.length;i++){var tool=state.tools[i],key=state.active+':'+tool.id;alive[key]=true;
   var b=keep(tools,tools.items,key,function(){var n=button('tool-'+tool.id,'','app-command',{id:state.active,command:tool.command},'app-tool');n.style.display='flex';n.style.flexDirection='row';n.style.gap='6px';n.label=document.createElement('span');n.label.style.flex='1';n.label.style.height='24px';n.icon=document.createElement('img');n.icon.style.width='20px';n.icon.style.height='20px';n.appendChild(n.icon);n.appendChild(n.label);
    n.addEventListener('mouseenter',function(){send('tool-tip',{id:state.active,panel:n.id})});n.addEventListener('mouseleave',function(){send('tool-tip-hide',{id:state.active})});return n;});
   b.label.textContent=(tool.busy?'◌ ':tool.checked?'✓ ':'')+tool.title;b.label.style.display=tool.compact&&tool.image!=='0'?'none':'flex';b.icon.src=tool.image;b.icon.style.display=tool.image==='0'?'none':'flex';b.disabled=!tool.enabled||tool.busy;b.icon.disabled=b.disabled;
   var width=tool.compact&&tool.image!=='0'?40:Math.max(70,Math.min(240,tool.title.length*16+40));var gap=lastGroup&&lastGroup!==tool.group?14:0;b.style.marginLeft=gap+'px';lastGroup=tool.group;b.style.width=width+'px';
   b.style.display=!overflow&&toolWidth+gap+width+76<=state.toolbarRect.width?'flex':'none';if(b.style.display==='flex')toolWidth+=gap+width+6;else overflow=true;
  }prune(tools,tools.items,alive);if(!tools.more){tools.more=button('tool-more','更多 ▾','tool-more',{id:state.active,panel:'tool-more'},'app-tool');tools.appendChild(tools.more)}tools.more.style.width='70px';tools.more.style.display=overflow?'flex':'none';tools.appendChild(tools.more);
  for(var p=0;p<state.panels.length;p++){var panel=state.panels[p];if(panel.floating)continue;var k=state.active+':panel:'+panel.id;live[k]=true;
   var box=keep(root,chromeNodes,k,function(){var n=document.createElement('div');n.className='chrome';n.title=document.createElement('div');n.title.className='panel-title';n.text=document.createElement('span');n.text.style.flex='1';n.text.addEventListener('mousedown',function(){send('panel-drag',{id:model.active,panel:n.panel.id})});n.title.appendChild(n.text);n.title.appendChild(button('panel-'+panel.id,'↗','panel-float',{id:state.active,panel:panel.id}));var fold=button('fold-'+panel.id,'▾','panel-collapse',{id:state.active,panel:panel.id});n.title.appendChild(fold);n.appendChild(n.title);n.split=document.createElement('div');n.split.style.height='5px';n.split.style.background='#536c92';n.split.addEventListener('mousedown',function(){send('panel-split',{id:model.active,panel:n.panel.id})});n.appendChild(n.split);return n;});box.panel=panel;place(box,panel.frame);box.text.textContent=(panel.collapsed?'▸ ':'')+panel.title;box.split.style.position='absolute';box.split.style.top=23+'px';box.split.style.width=panel.frame.width+'px';
   var edgeKey='side:'+panel.region;live[edgeKey]=true;var edge=keep(root,chromeNodes,edgeKey,function(){var n=document.createElement('div');n.className='chrome';n.style.background='#536c92';n.addEventListener('mousedown',function(){send('side-split',{id:model.active,panel:n.region===5?'left':'right'})});return n;});edge.region=panel.region;place(edge,{x:panel.region===5?panel.frame.x+panel.frame.width-4:panel.frame.x,y:panel.frame.y,width:4,height:28});
  }
  var status=keep(root,chromeNodes,'status',function(){var n=document.createElement('div');n.className='muted chrome';return n;});live.status=true;place(status,state.statusRect);status.textContent=state.status||state.activeLabel+' · '+state.dpi+' DPI';prune(root,chromeNodes,live);
 }
 function paintState(state) {
  model=state;setTheme(state.dark);var tabs=element('tabs'),alive={};
  for(var i=0;i<state.tabs.length;i++){var tab=state.tabs[i];alive[tab.id]=true;
   var row=keep(tabs,tabNodes,tab.id,function(){var n=document.createElement('div');n.className='tab';n.name=button('tab-'+tab.id,'','activate',{id:tab.id});n.appendChild(n.name);n.appendChild(button('close-'+tab.id,'×','close',{id:tab.id},'tab-close'));return n;});
   row.name.textContent=tab.title;row.name.className='tab-name'+(tab.active?' active':'');row.name.disabled=tab.closing;
  }prune(tabs,tabNodes,alive);
  element('empty').style.display=state.tabs.length?'none':'flex';element('assistant').style.display=state.assistant?'flex':'none';
  element('target').textContent=state.targetLabel||'选择应用';element('command').textContent=state.command||'选择命令';element('schema').value=state.schema||'';element('log').value=state.log||'';element('invoke').disabled=!state.canInvoke;element('cancel').disabled=!state.canCancel;
  if(element('params').value!==state.params)element('params').value=state.params;paintChrome(state);
 }
 var popupCommands={};
 function applyCommand(b,item){b.disabled=item.enabled===false||!!item.busy;b.style.display=item.visible===false?'none':'flex';b.label.textContent=(b.menuRow?'':item.busy?'◌ ':item.checked?'✓ ':'')+b.caption;if(b.mark)b.mark.textContent=item.busy?'◌':item.checked?'✓':'';b.icon.src=item.image||'0';b.icon.style.display=b.menuRow||item.image&&item.image!=='0'?'flex':'none';b.icon.disabled=b.disabled;}
 function paintPopup(state) {
  popupToken=state.token;setTheme(state.dark);element('popup').className='column'+(state.menu?' popup-menu':'');element('shell').style.display='none';element('popup').style.display='flex';
  element('popup-title').textContent=state.title;
  var detail=element('popup-detail');clear(detail);
  for(var d=0;d<state.detailParts.length;d++) {
   var part=document.createElement('div');part.textContent=state.detailParts[d];detail.appendChild(part);
  }
  var items=element('popup-items');clear(items);var actions=element('popup-actions');clear(actions);
  for(var i=0;i<state.items.length;i++) {
   var item=state.items[i];var extra={token:popupToken,id:item.id||'',command:item.command||'',answer:item.answer||''};
   var b=button('popup-item-'+i,'',item.action,extra,state.menu?'popup-menu-row':'');b.caption=item.title;b.menuRow=!!state.menu;b.label=document.createElement('span');b.icon=document.createElement('img');if(state.menu){b.mark=document.createElement('span');b.mark.style.width='16px';b.appendChild(b.mark);b.label.style.flex='1';var at=b.caption.lastIndexOf(' · ');b.shortcut=document.createElement('span');b.shortcut.className='popup-shortcut';b.shortcut.textContent=at>=0?b.caption.slice(at+3):'';if(at>=0)b.caption=b.caption.slice(0,at);b.shortcut.style.width='128px';b.shortcut.style.textAlign='right';}b.icon.style.width='20px';b.icon.style.height='20px';b.style.flexDirection='row';b.style.gap='6px';b.appendChild(b.icon);b.appendChild(b.label);if(b.shortcut)b.appendChild(b.shortcut);applyCommand(b,item);if(item.command)popupCommands[item.command]=b;items.appendChild(b);
  }
  if(state.confirm) {
   actions.appendChild(button('confirm-no','取消','confirm',{token:popupToken,answer:'no'}));
   actions.appendChild(button('confirm-yes','允许','confirm',{token:popupToken,answer:'yes'},'primary'));
  } else actions.appendChild(button('popup-dismiss','关闭','dismiss',{token:popupToken}));

 ui.onmessage=function(state) { if(state.type==='popup')paintPopup(state);else if(state.type==='state')paintState(state);else if(state.type==='command-states')for(var i=0;i<state.items.length;i++){var item=state.items[i],b=popupCommands[item.command];if(b)applyCommand(b,item);} };
 document.addEventListener('keydown',function(event) {
  if(event.keyCode===27){send('dismiss',{token:popupToken});return;}
  if(event.defaultPrevented||event.keyCode===13||event.keyCode===32||!model||!model.active)return;
  var active=document.activeElement,id=active?active.id:'',editing=id==='params'||id==='schema'||id==='log';
  if(editing&&(event.keyCode<=46||event.ctrlKey&&[65,67,86,88,89,90].indexOf(event.keyCode)>=0))return;
  send('app-shortcut',{id:model.active,key:String(event.keyCode),modifiers:String((event.ctrlKey?1:0)+(event.shiftKey?2:0)+(event.altKey?4:0)),editing:editing?'1':'0'});
 });
 ['menu','open','assistant-toggle','theme'].forEach(function(id) {
  var node=element(id);node.addEventListener('mouseenter',function(){send('tooltip',{id:id});});
  node.addEventListener('mouseleave',function(){send('tooltip-hide');});
 });
 send('ready');
})();
</script></body></html>
