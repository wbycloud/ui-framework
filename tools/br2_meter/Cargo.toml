[package]
name = "xuanshu-br2-meter"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
fixture = []

[dependencies]
deepseek-recipe = { path = "../../third_party/deepseek_recipe/deepseek-recipe" }
deepseek-recipe-encoding = { path = "../../third_party/deepseek_recipe/deepseek-recipe-encoding" }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
