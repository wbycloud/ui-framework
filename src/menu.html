<!doctype html><html><head><style>
body{padding:4px;display:flex;flex-direction:column;gap:0;background:#ffffff}
#heading,#back,#close{display:none}#items{flex:1;display:flex;flex-direction:column;gap:0;overflow-y:auto}
.menu-row{height:28px;padding:3px 6px;display:flex;flex-direction:row;gap:6px;text-align:left;border:0;border-radius:2px;background:#ffffff;align-items:center}
.menu-row:hover,.menu-row:focus,.menu-row.expanded{background:#e2eaf2}
.menu-row:active{background:#d3e2f1}
.menu-row:disabled{color:#919191;background:#ffffff}
.mark{width:16px;height:20px;align-items:center}.icon{width:18px;height:18px}.caption{flex:1;min-width:0;height:20px;align-items:center;white-space:nowrap}.shortcut{width:88px;text-align:right;color:#646468;font-size:12px}.arrow{width:12px;height:20px;align-items:center;text-align:right}
#detail{flex:1;overflow-y:auto}#up,#down{height:18px;padding:0;border:0;border-radius:0;background:#f0f0f2}
.dark{background:#252525}.dark .menu-row{background:#252525}.dark .menu-row:hover,.dark .menu-row:focus,.dark .menu-row.expanded{background:#383838}.dark .menu-row:active{background:#454545}.dark .menu-row:disabled{color:#999999;background:#252525}.dark .shortcut{color:#b3b3b7}.dark #up,.dark #down{background:#2b2b2b}
</style></head><body><div id="heading"></div><div id="detail" style="display:none"></div><button id="up">▴</button><div id="items"></div><button id="down">▾</button><button id="back"></button><button id="close"></button>
<script>
var model=null,buttons=[],selected=-1,nodes={},path=null;
function send(action,extra){var m=extra||{};m.action=action;ui.postMessage(m)}
function enterRow(){var row=this.menuOwner||this;if(!row.disabled){row.focus();send('hover',{id:row.item.id})}}
function leaveRow(){send('leave')}
function focusAt(index,step){step=step||1;if(!buttons.length)return;if(index>=buttons.length&&model.first+buttons.length<model.total){selected=buttons.length-1;send('scroll',{delta:1});return}if(index<0&&model.first>0){selected=0;send('scroll',{delta:-1});return}for(var i=0;i<buttons.length;i++){index=(index+buttons.length)%buttons.length;if(!buttons[index].disabled){selected=index;buttons[index].focus();buttons[index].scrollIntoView();return}index+=step}}
document.getElementById('close').addEventListener('click',function(){send('close')});document.getElementById('back').addEventListener('click',function(){send('back')});document.getElementById('up').addEventListener('click',function(){send('scroll',{delta:-1})});document.getElementById('down').addEventListener('click',function(){send('scroll',{delta:1})});
document.addEventListener('keydown',function(e){if(!model)return;
 if(e.keyCode===27){e.preventDefault();send('close')}
 else if(e.keyCode===13&&selected>=0&&buttons[selected]&&!buttons[selected].disabled){e.preventDefault();send('choose',{id:buttons[selected].item.id})}
 else if(e.keyCode===38||e.keyCode===40){e.preventDefault();focusAt(selected+(e.keyCode===38?-1:1),e.keyCode===38?-1:1)}
 else if(e.keyCode===37){e.preventDefault();send(model.back?'back':'group',{delta:-1})}
 else if(e.keyCode===39){e.preventDefault();if(selected>=0&&buttons[selected].item.group)send('choose',{id:buttons[selected].item.id});else send('group',{delta:1})}
 else if(e.keyCode>=48&&e.keyCode<=90){var hits=[];for(var i=0;i<buttons.length;i++)if(!buttons[i].disabled&&buttons[i].item.access===e.keyCode)hits.push(i);if(hits.length){e.preventDefault();var at=hits.indexOf(selected);focusAt(hits[(at+1)%hits.length]);if(hits.length===1)send('choose',{id:buttons[selected].item.id})}}
});
ui.onmessage=function(s){model=s;var root=document.getElementById('items'),keep={};buttons=[];document.body.className=s.dark?'dark':'';
 if(path!==s.title){selected=-1;path=s.title}document.getElementById('heading').textContent=s.title;document.getElementById('detail').textContent=s.detail||'';document.getElementById('detail').style.display=s.detail?'flex':'none';root.style.display=s.detail?'none':'flex';
 var existing=nodes;for(var i=0;i<s.items.length;i++){var m=s.items[i],id=m.dom,b=existing[id];keep[id]=true;
  if(!b){b=document.createElement('button');b.id=id;nodes[id]=b;b.mark=document.createElement('span');b.mark.className='mark';b.icon=document.createElement('img');b.icon.className='icon';b.label=document.createElement('span');b.label.className='caption';b.shortcut=document.createElement('span');b.shortcut.className='shortcut';b.shortcut.id=id+'-shortcut';b.arrow=document.createElement('span');b.arrow.className='arrow glyph';b.appendChild(b.mark);b.appendChild(b.icon);b.appendChild(b.label);b.appendChild(b.shortcut);b.appendChild(b.arrow);b.addEventListener('click',function(){send('choose',{id:this.item.id})});b.addEventListener('mouseenter',enterRow);b.addEventListener('mouseleave',leaveRow);var parts=[b.mark,b.icon,b.label,b.shortcut,b.arrow];for(var part=0;part<parts.length;part++){parts[part].menuOwner=b;parts[part].addEventListener('mouseenter',enterRow);parts[part].addEventListener('mouseleave',leaveRow)}b.addEventListener('focus',function(){selected=buttons.indexOf(this)})}
  b.item=m;b.className='menu-row'+(m.id===s.expanded?' expanded':'');b.mark.textContent=m.checked?'✓':m.busy?'◌':'';var title=m.title,suffix='('+m.shortcut+')';if(m.shortcut&&m.shortcut.indexOf('+')>=0&&title.slice(-suffix.length)===suffix)title=title.slice(0,-suffix.length);b.label.textContent=m.section?title+' / '+m.section:title;b.shortcut.textContent=m.shortcut||'';b.arrow.textContent=m.group?'\uE76C':'';b.icon.src=m.image;b.disabled=!m.enabled||m.busy;b.icon.disabled=b.disabled;root.appendChild(b);buttons.push(b)
 }for(var key in existing)if(!keep[key]){root.removeChild(existing[key]);delete nodes[key]}
 document.getElementById('back').disabled=!s.back;document.getElementById('up').disabled=s.first===0;document.getElementById('down').disabled=s.first+s.items.length>=s.total;document.getElementById('up').style.display=!s.detail&&s.total>s.items.length?'flex':'none';document.getElementById('down').style.display=!s.detail&&s.total>s.items.length?'flex':'none';
 var target=-1;for(var j=0;j<buttons.length;j++)if(buttons[j].item.id===s.focus)target=j;var at=buttons.indexOf(document.activeElement);if(target>=0)focusAt(target);else if(at>=0)selected=at;else focusAt(selected>=0&&selected<buttons.length?selected:0)
};
</script></body></html>
