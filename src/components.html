<!doctype html><html><head><style>
body{background:#151b26;color:#dbe4f2;font-family:Segoe UI;font-size:14px;padding:10px;gap:8px;display:flex;flex-direction:column}
button{background:#25364e;color:#e3ebf7;border:1px solid #425575;border-radius:5px;height:28px;padding:4px;white-space:nowrap}
input,textarea{background:#101723;color:#e3ebf7;border:1px solid #536c92;border-radius:4px;height:28px;padding:4px}
.heading{height:28px;font-weight:600}.controls{display:flex;flex-direction:row;height:30px;gap:6px}.rows{flex:1;overflow-y:hidden;overflow-x:hidden}.row{display:flex;flex-direction:row;height:32px;gap:2px;border:1px solid #26364c}.selected{background:#264976}.cell{height:30px;padding:4px;white-space:nowrap}.field{display:flex;flex-direction:column;gap:3px;padding:3px}.error{color:#ff9e9e;height:22px}.fields{flex:1;overflow-y:auto;gap:4px;display:flex;flex-direction:column}.footer{height:28px;color:#9caec8}.picture{width:28px;height:28px}.unit{color:#91a7c5}.node-menu{position:absolute;left:10px;top:100px;width:210px;padding:4px;background:#25364e;border:1px solid #536c92;display:flex;flex-direction:column;gap:3px}
</style></head><body><div id="title" class="heading"></div><div id="controls" class="controls"></div><div id="columns" class="row"></div><div id="rows" class="rows"></div><div id="fields" class="fields"></div><div id="footer" class="footer"></div><div id="node-menu" class="node-menu" style="display:none"></div><script>
var state=null, rowNodes={}, fieldNodes={}, edits={}, cols=[], hiddenCols={}, mounts=0, wasModal=false, menuWasOpen=false;
function send(x){ui.postMessage(x)}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}
function button(text,fn){var n=el('button','',text);n.addEventListener('click',fn);n.addEventListener('focus',function(){send({action:'focus',focused:'@control'})});n.addEventListener('blur',function(){send({action:'focus',focused:''})});return n}
function setText(n,t){if(n.textContent!==t)n.textContent=t}
function navigate(delta){if(!state)return;var f=Number(state.first)+delta;f=Math.max(0,Math.min(f,Math.max(0,Number(state.total)-1)));send({action:'scroll',first:String(f)})}
document.getElementById('rows').addEventListener('wheel',function(e){e.preventDefault();if(e.shiftKey)send({action:'columns',first:String(Math.max(0,state.firstColumn+(e.deltaY>0?1:-1)))});else navigate(e.deltaY>0?3:-3)});
function editCell(cell,row,v){if(v.flags&3)return;var key=row.id+':'+v.column;clear(cell);var n=el('input');n.value=edits[key]===undefined?v.text:edits[key];n.id='edit-'+row.id+'-'+v.column;edits[key]=n.value;cell.appendChild(n);n.addEventListener('focus',function(){send({action:'focus',focused:n.id})});n.addEventListener('blur',function(){send({action:'focus',focused:''})});n.focus();n.addEventListener('input',function(){edits[key]=n.value});n.addEventListener('keydown',function(e){if(e.keyCode===13){e.preventDefault();var value=n.value;delete edits[key];clear(cell);cell.textContent=value;cell.signature='';send({action:'edit',id:row.id,column:v.column,text:value})}if(e.keyCode===27){e.preventDefault();delete edits[key];clear(cell);cell.textContent=cell.datum.text;cell.signature=''}})}
function updateCell(cell,row,v){cell.row=row;cell.datum=v;cell.style.display=hiddenCols[v.column]?'none':'flex';cell.style.width=(cols[v.column]||120)+'px';var signature=JSON.stringify([v.kind,v.text,v.flags,v.color,v.image,v.error,row.imageState]);if(cell.signature===signature)return;cell.signature=signature;
if(edits[row.id+':'+v.column]!==undefined){if(!cell.firstChild)editCell(cell,row,v);return}clear(cell);
if(v.kind===3){var b=button(v.text==='true'?'☑':'☐',function(){send({action:'edit',id:row.id,column:v.column,text:v.text==='true'?'false':'true'})});b.disabled=!!(v.flags&3);cell.appendChild(b)}
else if(v.kind===6||v.kind===7){var img=el('img','picture');img.style.background='#25364e';img.src=v.image;img.disabled=!!(v.flags&2);cell.appendChild(img);if(v.image==='0'){var hint=el('span','',row.imageState==='failed'?'失败':row.imageState==='loading'?'加载中':'暂无');cell.appendChild(hint)}}
else if(v.kind===5){cell.style.background='#'+('000000'+(v.color>>>8).toString(16)).slice(-6);cell.textContent=v.text}
else{cell.textContent=v.text;cell.row=row;cell.datum=v;if(!cell.bound){cell.bound=true;cell.addEventListener('click',function(){if(edits[cell.row.id+':'+cell.datum.column]===undefined)editCell(cell,cell.row,cell.datum)})}}}
function updateRow(r){var n=rowNodes[r.id];if(!n){mounts++;n=el('div','row');n.cells={};n.addEventListener('mousedown',function(){send({action:'select',id:r.id})});n.addEventListener('contextmenu',function(e){e.preventDefault();send({action:'context',id:r.id})});n.id='row-'+r.id;rowNodes[r.id]=n}
n.row=r;n.className=r.id===state.selected?'row selected':'row';n.style.height=state.rowHeight+'px';n.style.display=state.buffered&&(r.position<state.bufferStart||r.position>=state.visibleCount-2)?'none':'flex';
if(state.kind===1||state.kind===3){if(!n.label){n.label=button('',function(){if(n.row.children)send({action:'expand',id:n.row.id});});n.label.id='tree-label-'+r.id;n.appendChild(n.label);n.rename=el('input');n.rename.style.display='none';n.rename.id='rename-'+r.id;n.rename.addEventListener('focus',function(){send({action:'focus',focused:n.rename.id})});n.rename.addEventListener('blur',function(){send({action:'focus',focused:''})});n.appendChild(n.rename);n.label.addEventListener('keydown',function(e){if(e.keyCode===113){e.preventDefault();n.rename.style.display='flex';n.rename.value=n.row.title;n.rename.focus()}});n.rename.addEventListener('keydown',function(e){if(e.keyCode===13){e.preventDefault();send({action:'rename',id:n.row.id,text:n.rename.value});n.rename.style.display='none'}if(e.keyCode===27){e.preventDefault();n.rename.style.display='none';n.label.focus()}});n.icon=el('img','picture');n.appendChild(n.icon)}setText(n.label,(r.children?(r.expanded?'▾ ':'▸ '):'')+r.title);n.label.style.margin='0 0 0 '+(r.depth*14)+'px';n.icon.src=r.image}
var alive={};for(var i=0;i<r.cells.length;i++){var v=r.cells[i];alive[v.column]=true;var cell=n.cells[v.column];if(!cell){cell=el('div','cell');cell.id='cell-'+r.id+'-'+v.column;n.cells[v.column]=cell;n.appendChild(cell)}updateCell(cell,r,v)}for(var k in n.cells)if(!alive[k]){n.removeChild(n.cells[k]);delete n.cells[k]}return n}
function draft(n,value){n.field.flags=(n.field.flags&~4)|8;n.field.value.text=value;updateField(n.field);send({action:'draft',field:n.field.id,text:value})}
function updateField(f){var n=fieldNodes[f.id];if(!n){n=el('div','field');n.label=el('div');n.preview=el('img','picture');n.preview.style.display='none';n.error=el('div','error');n.input=el(f.flags&32?'textarea':'input');n.input.id='field-'+f.id;n.unit=el('div','unit');n.appendChild(n.label);n.appendChild(n.input);n.appendChild(n.unit);n.appendChild(n.error);n.appendChild(n.preview);fieldNodes[f.id]=n;
n.input.addEventListener('focus',function(){send({action:'focus',focused:n.input.id})});n.input.addEventListener('blur',function(){send({action:'focus',focused:''})});n.input.addEventListener('input',function(){draft(n,n.input.value)});n.input.addEventListener('keydown',function(e){if(e.keyCode===27){e.preventDefault();send({action:'cancel'})}if(e.keyCode===13&&(!(n.field.flags&32)||e.ctrlKey)){e.preventDefault();send({action:'submit'})}});
if(f.kind===3||f.kind===4){n.toggle=button('',function(){var f=n.field,value;if(f.kind===3)value=n.input.value==='true'?'false':'true';else{var at=f.options.indexOf(n.input.value);value=f.options[(at+1)%f.options.length]||''}n.input.value=value;draft(n,value)});n.appendChild(n.toggle);n.input.style.display='none'}}
n.field=f;if(f.kind===6||f.kind===7){n.input.style.display='none';n.preview.style.display='flex';n.preview.src=f.value.image;n.preview.disabled=!!(f.flags&2)}if(f.kind===8)n.input.style.display='none';if(f.kind===5)n.preview.style.background='#'+('000000'+(f.value.color>>>8).toString(16)).slice(-6);setText(n.label,(f.group?f.group+' / ':'')+f.title+(f.flags&8?' *':'')+(f.flags&4?' (混合值)':''));setText(n.unit,f.unit);setText(n.error,f.value.error);if(n.input.value!==f.value.text)n.input.value=f.value.text;n.input.disabled=!!(f.flags&2);n.input.readOnly=!!(f.flags&1);if(n.toggle){setText(n.toggle,f.kind===3?(f.flags&4?'混合':f.value.text==='true'?'☑ 是':'☐ 否'):f.value.text||'选择');n.toggle.disabled=!!(f.flags&3)}return n}
document.addEventListener('keydown',function(e){if(!state||e.defaultPrevented)return;if(state.menu.length&&e.keyCode===27){e.preventDefault();send({action:'menu-close'});return}if(state.kind!==6)return;var active=document.activeElement,multi=false;for(var key in fieldNodes)if(fieldNodes[key].input===active)multi=!!(fieldNodes[key].field.flags&32);if(e.keyCode===27){e.preventDefault();send({action:'cancel'})}else if(e.keyCode===13&&(!multi||e.ctrlKey)){e.preventDefault();send({action:'submit'})}});
function showMenu(s){var hadMenu=menuWasOpen;menuWasOpen=!!s.menu.length;var root=document.getElementById('node-menu');clear(root);root.style.display=s.menu.length?'flex':'none';root.style.width=Math.max(80,Math.min(210,s.width-20))+'px';for(var i=0;i<s.menu.length;i++)(function(m,index){var b=button('',function(){send({action:'menu',entry:m.id})});b.id='node-menu-'+index;b.disabled=!m.enabled;b.style.flexDirection='row';if(m.image!=='0'){var image=el('img','picture');image.src=m.image;b.appendChild(image)}b.appendChild(el('span','',(m.checked?'✓ ':'')+m.title));root.appendChild(b)})(s.menu[i],i);if(s.menu.length)root.appendChild(button('关闭菜单',function(){send({action:'menu-close'})}));if(s.menu.length&&(!hadMenu||!document.activeElement))root.firstChild.focus()}
ui.onmessage=function(s){state=s;document.body.style.display=s.visible?'flex':'none';setText(document.getElementById('title'),s.title);var controls=document.getElementById('controls');if(!controls.firstChild){if(s.kind<=3){controls.appendChild(button('上一页',function(){navigate(-state.visibleCount)}));var next=button('下一页',function(){navigate(state.visibleCount)});next.id='next-page';controls.appendChild(next);if(s.kind!==1){controls.appendChild(button('←列',function(){send({action:'columns',first:String(Math.max(0,state.firstColumn-1))})}));controls.appendChild(button('列→',function(){send({action:'columns',first:String(state.firstColumn+1)})}))}}else{var submit=button('提交',function(){send({action:'submit'})});submit.id='submit';controls.appendChild(submit);var cancel=button('取消',function(){send({action:'cancel'})});cancel.id='cancel';controls.appendChild(cancel)}}
var header=document.getElementById('columns');var key=JSON.stringify(s.columns);if(header.signature!==key){header.signature=key;clear(header);cols={};hiddenCols={};for(var j=0;j<s.columns.length;j++){var col=s.columns[j];cols[col.id]=col.width;hiddenCols[col.id]=col.buffer;var h=el('div','cell',col.title);h.style.width=col.width+'px';h.style.display=col.buffer?'none':'flex';header.appendChild(h)}}header.style.display=s.columns.length?'flex':'none';
var root=document.getElementById('rows'),alive={};for(var i=0;i<s.rows.length;i++){var r=s.rows[i];alive[r.id]=true;root.appendChild(updateRow(r))}for(var k in rowNodes)if(!alive[k]){root.removeChild(rowNodes[k]);delete rowNodes[k]}root.style.display=s.kind<=3?'flex':'none';
var fields=document.getElementById('fields');for(var z=0;z<s.fields.length;z++)fields.appendChild(updateField(s.fields[z]));fields.style.display=s.fields.length?'flex':'none';setText(document.getElementById('footer'),'范围 '+s.first+' / '+s.total+' · '+s.rows.length+' 行 · '+s.columns.length+' 列');document.getElementById('footer').style.display=s.kind<=3?'flex':'none';controls.style.display=s.kind===6||s.kind===4?'flex':s.kind<=3?'flex':'none';showMenu(s);if(s.kind===6&&s.modal&&!wasModal){for(var f in fieldNodes){var n=fieldNodes[f];if(!(n.field.flags&2)&&n.field.kind!==3&&n.field.kind!==4){n.input.focus();break}}}wasModal=s.modal;send({action:'metrics',nodes:String(document.nodeCount),mounts:String(mounts),focused:document.activeElement?document.activeElement.id:''})};
</script></body></html>
