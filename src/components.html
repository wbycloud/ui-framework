<!doctype html><html><head><style>
body{background:#151b26;color:#dbe4f2;font-family:Segoe UI;font-size:14px;padding:10px;gap:8px;display:flex;flex-direction:column}

.heading{height:28px;font-weight:600}.controls{display:flex;flex-direction:row;height:30px;gap:6px}.rows{flex:1;overflow-y:hidden;overflow-x:hidden}.row{display:flex;flex-direction:row;height:32px;gap:2px;border:1px solid #26364c}.selected{background:#264976}.cell{height:30px;padding:4px;white-space:nowrap}.field{display:flex;flex-direction:column;gap:3px;padding:3px}.error{color:#ff9e9e;height:22px}.fields{flex:1;overflow-y:auto;gap:4px;display:flex;flex-direction:column}.footer{height:28px;color:#9caec8}.picture{width:28px;height:28px}.unit{color:#91a7c5}
</style></head><body><div id="title" class="heading"></div><div id="controls" class="controls"></div><div id="columns" class="row"></div><div id="rows" class="rows"></div><div id="fields" class="fields"></div><div id="footer" class="footer"></div><script>
var state=null, rowNodes={}, fieldNodes={}, edits={}, cols=[], hiddenCols={}, mounts=0, wasModal=false, chooser=null, chooserOwner=null, choicePage=0, choiceIndex=0, cursor=null, pendingCursor=null, generation='';
function send(x){ui.postMessage(x)}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}
function orderNodes(root,nodes,key){if(root.orderKey===key)return;var active=document.activeElement,id=active?active.id:'';for(var i=0;i<nodes.length;i++)root.appendChild(nodes[i]);root.orderKey=key;if(id){var n=document.getElementById(id);if(n&&!n.disabled)n.focus()}}
function button(text,fn){var n=el('button','',text);n.addEventListener('click',fn);n.addEventListener('focus',function(){send({action:'focus',focused:'@control'})});n.addEventListener('blur',function(){send({action:'focus',focused:''})});return n}
function setText(n,t){if(n.textContent!==t)n.textContent=t}
function navigate(delta){if(!state)return;var f=Number(state.first)+delta;f=Math.max(0,Math.min(f,Math.max(0,Number(state.total)-1)));send({action:'scroll',first:String(f)})}
function closeChoices(){if(chooser)chooser.style.display='none';chooserOwner=null}
function chooseValue(n,value){n.input.value=value;draft(n,value);closeChoices();if(n.toggle)n.toggle.focus();else n.input.focus()}
function showChoices(n){if(n.field.flags&3)return;if(chooserOwner===n){closeChoices();return}chooserOwner=n;choicePage=0;choiceIndex=Math.max(0,n.field.options.indexOf(n.input.value));paintChoices()}
function paintChoices(){var n=chooserOwner;if(!n)return;if(!chooser){chooser=el('div');chooser.style.display='flex';chooser.style.flexDirection='column';chooser.style.gap='2px'}clear(chooser);n.appendChild(chooser);chooser.style.display='flex';
var values=n.field.kind===5?['#ff0000ff','#00ff00ff','#0000ffff','#ffffffff','#000000ff','#00000000']:n.field.options;
for(var i=choicePage;i<values.length&&i<choicePage+8;i++){(function(index){var value=values[index],b=button((index===choiceIndex?'● ':'')+value,function(){chooseValue(n,value)});b.id=(n.field.kind===5?'swatch-':'option-')+n.field.id+'-'+index;if(n.field.kind===5)b.style.background=value.slice(0,7);chooser.appendChild(b)})(i)}
if(choicePage>0)chooser.appendChild(button('上一组',function(){choicePage-=8;paintChoices()}));if(choicePage+8<values.length)chooser.appendChild(button('下一组',function(){choicePage+=8;paintChoices()}));}
function choiceKey(n,e){if(e.keyCode===27&&chooserOwner===n){e.preventDefault();closeChoices();n.toggle.focus();return}if(e.keyCode!==38&&e.keyCode!==40&&e.keyCode!==13)return;
e.preventDefault();if(chooserOwner!==n){showChoices(n);return}var values=n.field.kind===5?['#ff0000ff','#00ff00ff','#0000ffff','#ffffffff','#000000ff','#00000000']:n.field.options;if(!values.length)return;
if(e.keyCode===13)chooseValue(n,values[choiceIndex]);else{choiceIndex=Math.max(0,Math.min(values.length-1,choiceIndex+(e.keyCode===40?1:-1)));choicePage=Math.floor(choiceIndex/8)*8;paintChoices()}}
function focusCell(cell){cursor={id:cell.row.id,column:cell.datum.column,index:cell.row.index};cell.focus();send({action:'focus',focused:cell.id})}
function tableKey(cell,e){if(!state||state.kind!==2||e.defaultPrevented)return;if(e.keyCode===13||e.keyCode===113){e.preventDefault();editCell(cell,cell.row,cell.datum);return}

var index=Number(cell.row.index),column=state.firstColumn;for(var j=0;j<state.columns.length;j++)if(state.columns[j].id===cell.datum.column)column=state.firstColumn+j-(state.firstColumn?1:0);
if(e.keyCode===38)index--;if(e.keyCode===40)index++;if(e.keyCode===37||e.keyCode===9&&e.shiftKey)column--;if(e.keyCode===39||e.keyCode===9&&!e.shiftKey)column++;if(e.keyCode===36)column=0;if(e.keyCode===35)column=state.totalColumns-1;
index=Math.max(0,Math.min(index,Number(state.total)-1));column=Math.max(0,Math.min(column,state.totalColumns-1));pendingCursor={index:String(index),column:column,shift:!!e.shiftKey,ctrl:!!e.ctrlKey};
for(var i=0;i<state.rows.length;i++)if(state.rows[i].index===pendingCursor.index){var target=rowNodes[state.rows[i].id],col=null;for(var k=0;k<state.columns.length;k++)if(state.firstColumn+k-(state.firstColumn?1:0)===column)col=state.columns[k].id;
if(target&&col&&target.cells[col]&&target.style.display!=='none'){var next=target.cells[col];pendingCursor=null;focusCell(next);send({action:'select',id:next.row.id,index:next.row.index,shift:!!e.shiftKey,ctrl:!!e.ctrlKey});return}}
send({action:'columns',first:String(column)});send({action:'scroll',first:String(index)});}
document.getElementById('rows').addEventListener('wheel',function(e){e.preventDefault();if(e.shiftKey)send({action:'columns',first:String(Math.max(0,state.firstColumn+(e.deltaY>0?1:-1)))});else navigate(e.deltaY>0?3:-3)});
function editCell(cell,row,v){if(v.flags&3)return;var key=row.id+':'+v.column;clear(cell);var n=el('input');n.value=edits[key]===undefined?v.text:edits[key];n.id='edit-'+row.id+'-'+v.column;edits[key]=n.value;cell.appendChild(n);n.addEventListener('focus',function(){send({action:'focus',focused:n.id})});n.addEventListener('blur',function(){send({action:'focus',focused:''})});n.focus();n.addEventListener('input',function(){edits[key]=n.value});n.addEventListener('keydown',function(e){if(e.keyCode===13){e.preventDefault();var value=n.value;delete edits[key];clear(cell);cell.textContent=value;cell.signature='';send({action:'edit',id:row.id,column:v.column,text:value});focusCell(cell)}if(e.keyCode===27){e.preventDefault();delete edits[key];clear(cell);cell.textContent=cell.datum.text;cell.signature='';focusCell(cell)}})}
function updateCell(cell,row,v){cell.row=row;cell.datum=v;if(!cell.keyBound){cell.keyBound=true;cell.tabIndex=0;cell.addEventListener('keydown',function(e){tableKey(cell,e)});cell.addEventListener('mousedown',function(){if(edits[cell.row.id+':'+cell.datum.column]===undefined)focusCell(cell)})}cell.style.display=hiddenCols[v.column]?'none':'flex';cell.style.width=(cols[v.column]||120)+'px';var signature=JSON.stringify([v.kind,v.text,v.flags,v.color,v.image,v.error,row.imageState]);if(cell.signature===signature)return;cell.signature=signature;
if(edits[row.id+':'+v.column]!==undefined){if(!cell.firstChild)editCell(cell,row,v);return}clear(cell);
if(v.kind===3){var b=button(v.text==='true'?'☑':'☐',function(){send({action:'edit',id:row.id,column:v.column,text:v.text==='true'?'false':'true'})});b.disabled=!!(v.flags&3);cell.appendChild(b)}
else if(v.kind===6||v.kind===7){var img=el('img','picture');img.style.background='#25364e';img.src=v.image;img.disabled=!!(v.flags&2);cell.appendChild(img);if(v.image==='0'){var hint=el('span','',row.imageState==='failed'?'失败':row.imageState==='loading'?'加载中':'暂无');cell.appendChild(hint)}}
else if(v.kind===5){cell.style.background='#'+('000000'+(v.color>>>8).toString(16)).slice(-6);cell.textContent=v.text}
else{cell.textContent=v.text;cell.row=row;cell.datum=v;if(!cell.bound){cell.bound=true;cell.addEventListener('click',function(){if(state.experience&&state.kind===2){focusCell(cell);return}if(edits[cell.row.id+':'+cell.datum.column]===undefined)editCell(cell,cell.row,cell.datum)})}}}
function updateRow(r){var n=rowNodes[r.id];if(!n){mounts++;n=el('div','row');n.cells={};n.addEventListener('mousedown',function(e){send({action:'select',id:n.row.id,index:n.row.index,ctrl:!!e.ctrlKey,shift:!!e.shiftKey})});n.addEventListener('contextmenu',function(e){e.preventDefault();send({action:'context',id:n.row.id})});n.id='row-'+r.id;rowNodes[r.id]=n}
n.row=r;n.className=state.selection.indexOf(r.id)>=0?'row selected':'row';n.style.height=state.rowHeight+'px';n.style.display=state.buffered&&(r.position<state.bufferStart||r.position>=state.visibleCount-2)?'none':'flex';
if(state.kind===1||state.kind===3){if(!n.label){n.label=button('',function(){if(n.row.children)send({action:'expand',id:n.row.id});});n.label.id='tree-label-'+r.id;n.label.style.flex='1';n.label.style.minWidth='0px';n.label.style.textAlign='left';n.label.addEventListener('mouseenter',function(){send({action:'tip',id:n.row.id})});n.label.addEventListener('mouseleave',function(){send({action:'tip-hide'})});n.appendChild(n.label);n.rename=el('input');n.rename.style.display='none';n.rename.id='rename-'+r.id;n.rename.addEventListener('focus',function(){send({action:'focus',focused:n.rename.id})});n.rename.addEventListener('blur',function(){send({action:'focus',focused:''})});n.appendChild(n.rename);n.label.addEventListener('keydown',function(e){if(e.keyCode===113){e.preventDefault();n.label.style.display='none';n.rename.style.flex='1';n.rename.style.display='flex';n.rename.value=n.row.title;n.rename.focus()}});n.rename.addEventListener('keydown',function(e){if(e.keyCode===13){e.preventDefault();send({action:'rename',id:n.row.id,text:n.rename.value});n.rename.style.display='none';n.label.style.display='flex'}if(e.keyCode===27){e.preventDefault();n.rename.style.display='none';n.label.style.display='flex';n.label.focus()}});n.icon=el('img','picture');n.appendChild(n.icon)}setText(n.label,(r.children?(r.expanded?'▾ ':'▸ '):'')+r.title);n.label.style.margin='0 0 0 '+(r.depth*14)+'px';n.icon.src=r.image;n.icon.style.display=r.image==='0'?'none':'flex'}
var alive={};for(var i=0;i<r.cells.length;i++){var v=r.cells[i];alive[v.column]=true;var cell=n.cells[v.column];if(!cell){cell=el('div','cell');cell.id='cell-'+r.id+'-'+v.column;n.cells[v.column]=cell;n.appendChild(cell)}updateCell(cell,r,v)}for(var k in n.cells)if(!alive[k]){n.removeChild(n.cells[k]);delete n.cells[k]}return n}
function draft(n,value){n.field.flags=(n.field.flags&~4)|8;n.field.value.text=value;updateField(n.field);send({action:'draft',field:n.field.id,text:value})}
function updateField(f){var n=fieldNodes[f.id];if(!n){n=el('div','field');n.label=el('div');n.preview=el('img','picture');n.preview.style.display='none';n.error=el('div','error');n.input=el(f.flags&32?'textarea':'input');n.input.id='field-'+f.id;n.unit=el('div','unit');n.appendChild(n.label);n.appendChild(n.input);n.appendChild(n.unit);n.appendChild(n.error);n.appendChild(n.preview);fieldNodes[f.id]=n;
n.input.addEventListener('focus',function(){send({action:'focus',focused:n.input.id})});n.input.addEventListener('blur',function(){send({action:'focus',focused:''})});n.input.addEventListener('input',function(){draft(n,n.input.value)});n.input.addEventListener('keydown',function(e){if(e.keyCode===27){e.preventDefault();send({action:'cancel'})}if(e.keyCode===13&&(!(n.field.flags&32)||e.ctrlKey)){e.preventDefault();send({action:'submit'})}});
if(f.kind===3||f.kind===4||f.kind===5){n.toggle=button('',function(){if(n.field.kind!==3){showChoices(n);return}var value=n.input.value==='true'?'false':'true';n.input.value=value;draft(n,value)});n.toggle.id=(f.kind===5?'color-':'choice-')+f.id;n.toggle.addEventListener('keydown',function(e){if(n.field.kind!==3)choiceKey(n,e)});n.appendChild(n.toggle);if(f.kind!==5)n.input.style.display='none'}}
n.field=f;if(f.kind===6||f.kind===7){n.input.style.display='none';n.preview.style.display='flex';n.preview.src=f.value.image;n.preview.disabled=!!(f.flags&2)}if(f.kind===8)n.input.style.display='none';if(f.kind===5){var color=f.value.text.slice(0,7);n.toggle.style.background=/^#[0-9a-fA-F]{6}$/.test(color)?color:'#25364e'}setText(n.label,(f.group?f.group+' / ':'')+f.title+(f.flags&8?' *':'')+(f.flags&4?' (混合值)':''));setText(n.unit,f.unit);setText(n.error,f.value.error);if(n.input.value!==f.value.text)n.input.value=f.value.text;n.input.disabled=!!(f.flags&2);n.input.readOnly=!!(f.flags&1);if(n.toggle){setText(n.toggle,f.kind===3?(f.flags&4?'混合':f.value.text==='true'?'☑ 是':'☐ 否'):(f.kind===5?'颜色 ▾':(f.value.text||'选择')+' ▾'));n.toggle.disabled=!!(f.flags&3)}return n}
document.addEventListener('keydown',function(e){if(!state||e.defaultPrevented)return;if(state.kind!==6)return;var active=document.activeElement,multi=false;for(var key in fieldNodes)if(fieldNodes[key].input===active)multi=!!(fieldNodes[key].field.flags&32);if(e.keyCode===27){e.preventDefault();send({action:'cancel'})}else if(e.keyCode===13&&(!multi||e.ctrlKey)){e.preventDefault();send({action:'submit'})}});
ui.onmessage=function(s){if(generation!==s.generation){generation=s.generation;edits={};cursor=pendingCursor=null;closeChoices();for(var rowId in rowNodes){var cells=rowNodes[rowId].cells;for(var columnId in cells)cells[columnId].signature=''}}state=s;document.body.style.display=s.visible?'flex':'none';setText(document.getElementById('title'),s.title);var controls=document.getElementById('controls');if(!controls.firstChild){if(s.kind<=3){controls.appendChild(button('上一页',function(){navigate(-state.visibleCount)}));var next=button('下一页',function(){navigate(state.visibleCount)});next.id='next-page';controls.appendChild(next);if(s.kind!==1){controls.appendChild(button('←列',function(){send({action:'columns',first:String(Math.max(0,state.firstColumn-1))})}));controls.appendChild(button('列→',function(){send({action:'columns',first:String(state.firstColumn+1)})}))}}else{var submit=button('提交',function(){send({action:'submit'})});submit.id='submit';controls.appendChild(submit);var cancel=button('取消',function(){send({action:'cancel'})});cancel.id='cancel';controls.appendChild(cancel)}}
var header=document.getElementById('columns');var key=JSON.stringify([s.columns,s.sortColumn,s.sortDirection]);if(header.signature!==key){header.signature=key;clear(header);cols={};hiddenCols={};for(var j=0;j<s.columns.length;j++){var col=s.columns[j];cols[col.id]=col.width;hiddenCols[col.id]=col.buffer;var h;if(s.sortable){(function(col){h=button(col.title+(s.sortColumn===col.id?(s.sortDirection===1?' ↑':' ↓'):''),function(){send({action:'sort',column:col.id,direction:state.sortColumn!==col.id?1:state.sortDirection===1?-1:0})});h.id='sort-'+col.id})(col)}else h=el('div','cell',col.title);h.style.width=col.width+'px';h.style.display=col.buffer?'none':'flex';header.appendChild(h)}}header.style.display=s.columns.length?'flex':'none';
var root=document.getElementById('rows'),alive={},ordered=[],rowOrder=[];for(var i=0;i<s.rows.length;i++){var r=s.rows[i];alive[r.id]=true;ordered.push(updateRow(r));rowOrder.push(r.id)}for(var k in rowNodes)if(!alive[k]){root.removeChild(rowNodes[k]);delete rowNodes[k]}orderNodes(root,ordered,rowOrder.join(','));root.style.display=s.kind<=3?'flex':'none';
if(pendingCursor){for(var i=0;i<s.rows.length;i++)if(s.rows[i].index===pendingCursor.index){var r=s.rows[i],col=s.columns[pendingCursor.column-s.firstColumn+(s.firstColumn?1:0)];if(col&&rowNodes[r.id].cells[col.id]){var target=rowNodes[r.id].cells[col.id],pending=pendingCursor;pendingCursor=null;focusCell(target);send({action:'select',id:r.id,index:r.index,ctrl:pending.ctrl,shift:pending.shift});break}}}
var fields=document.getElementById('fields'),orderedFields=[],fieldOrder=[];for(var z=0;z<s.fields.length;z++){orderedFields.push(updateField(s.fields[z]));fieldOrder.push(s.fields[z].id)}orderNodes(fields,orderedFields,fieldOrder.join(','));fields.style.display=s.fields.length?'flex':'none';setText(document.getElementById('footer'),'范围 '+s.first+' / '+s.total+' · '+s.rows.length+' 行 · '+s.columns.length+' 列');document.getElementById('footer').style.display=s.kind<=3?'flex':'none';controls.style.display=s.kind===6||s.kind===4?'flex':s.kind<=3?'flex':'none';if(s.kind===6&&s.modal&&!wasModal){for(var f in fieldNodes){var n=fieldNodes[f];if(!(n.field.flags&2)&&n.field.kind!==3&&n.field.kind!==4){n.input.focus();break}}}wasModal=s.modal;send({action:'metrics',nodes:String(document.nodeCount),mounts:String(mounts),focused:document.activeElement?document.activeElement.id:''})};
</script></body></html>
