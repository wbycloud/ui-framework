name: Windows C11 regression matrix
on:
  push:
    branches: [main, codex/menus-offscreen]
  pull_request:
  workflow_dispatch:
    inputs:
      p1_process_diagnostic:
        description: "Diagnostic only: original two Light cases, process boundaries and stall dumps"
        type: boolean
        default: false
      p1_candidate_url:
        description: "Explicitly authorized candidate archive URL; pinned SHA verified below"
        type: string
        required: false
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.p1_process_diagnostic && '["webview2","osmesa"]' || '["native","light","webview2","osmesa"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pinned dependencies and real Runtime
        shell: pwsh
        run: ./tools/windows-ci.ps1 -Configuration ${{ matrix.configuration }} -Stage prepare
      - name: C11 x64 build
        shell: pwsh
        run: ./tools/windows-ci.ps1 -Configuration ${{ matrix.configuration }} -Stage build
      - name: Necessary regressions
        env:
          UI_P1_CANDIDATE_URL: ${{ inputs.p1_candidate_url }}
        shell: pwsh
        run: |
          ./tools/test-windows-ci.ps1
          if ('${{ inputs.p1_process_diagnostic }}' -eq 'true') {
            if (!$env:UI_P1_CANDIDATE_URL) { throw 'Candidate URL required for the authorized P1 run' }
            Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class UiP1Desktop { [DllImport("user32.dll")] public static extern int GetSystemMetrics(int i); [DllImport("user32.dll")] public static extern uint GetDpiForSystem(); }'
            $desktopBefore = @([UiP1Desktop]::GetSystemMetrics(0),[UiP1Desktop]::GetSystemMetrics(1))
            if ($env:GITHUB_ACTIONS -eq 'true') { Set-DisplayResolution -Width 1920 -Height 1080 -Force }
            @{before=$desktopBefore;after=@([UiP1Desktop]::GetSystemMetrics(0),[UiP1Desktop]::GetSystemMetrics(1));dpi=[UiP1Desktop]::GetDpiForSystem()} | ConvertTo-Json | Set-Content 'build/ci-evidence-${{ matrix.configuration }}/lifecycle-desktop.json'
            $candidateRoot = 'build/ci-evidence-${{ matrix.configuration }}/lifecycle-candidate'
            New-Item -ItemType Directory -Path $candidateRoot | Out-Null
            Invoke-WebRequest $env:UI_P1_CANDIDATE_URL -OutFile "$candidateRoot/candidate.zip"
            if ((Get-FileHash "$candidateRoot/candidate.zip").Hash.ToLowerInvariant() -ne 'afb11d7bf599e991f8e2b7df6971813f8bb6bca66f91f85c8f20b7b5cf59c8ae') { throw 'Candidate archive hash mismatch' }
            Expand-Archive -LiteralPath "$candidateRoot/candidate.zip" -DestinationPath "$candidateRoot/unpacked"
            Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-debug-info-msvc.7z' -OutFile "$candidateRoot/original-debug.7z"
            if ((Get-FileHash "$candidateRoot/original-debug.7z").Hash.ToLowerInvariant() -ne '60b2ccf9d81646aab53ce50bb1117c292e314049799b58f620d6838d134b48b1') { throw 'Original debug archive hash mismatch' }
            & 7z x "$candidateRoot/original-debug.7z" "-o$candidateRoot/original-symbols" 'x64/osmesa.pdb' -y | Out-File "$candidateRoot/original-symbols-extraction.log"
            if ($LASTEXITCODE) { throw 'Original symbol extraction failed' }
            if ((Get-FileHash "$candidateRoot/original-symbols/x64/osmesa.pdb").Hash.ToLowerInvariant() -ne '42659470e93b8305d514a956e830d1455318b326b2d2829e61426ca265967ee7') { throw 'Original PDB hash mismatch' }
            if ((Get-FileHash "$candidateRoot/unpacked/osmesa.pdb").Hash.ToLowerInvariant() -ne 'c5c15c5cc6673b795d21fa721d87a6abb382005417129685903937e744f73bbd') { throw 'Candidate PDB hash mismatch' }
            python tests/run_osmesa_lifecycle_control.py --build build/ci-${{ matrix.configuration }} --original .deps/mesa-24.3.4/x64/osmesa.dll --candidate "$candidateRoot/unpacked/osmesa.dll" --evidence build/ci-evidence-${{ matrix.configuration }}/lifecycle-control
            if ($LASTEXITCODE) { throw 'Original/candidate diagnostic includes failures; inspect both retained results' }
          } else {
            ./tools/windows-ci.ps1 -Configuration ${{ matrix.configuration }} -Stage test
          }
      - name: Public result and environment
        if: always()
        shell: pwsh
        run: |
          $directory = 'build/ci-evidence-${{ matrix.configuration }}'
          foreach ($file in @('manifest.json','compatibility-policy.json','dependencies.log','runtime.log','regression.log','test-output.log')) {
            $path = "$directory/$file"
            if (Test-Path $path) {
              $value = Get-Content $path -Raw
              "$file`n``````text`n$value`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
              for ($offset=0;$offset -lt $value.Length;$offset+=3000) {
                $part = $value.Substring($offset,[Math]::Min(3000,$value.Length-$offset)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output "::notice file=.github/workflows/windows-regression.yml,line=1,title=${{ matrix.configuration }} $file offset=${offset}::$part"
              }
            }
          }
          foreach ($file in @('configure.log','build.log')) {
            $path = "$directory/$file"
            if (Test-Path $path) {
              $value = (Get-Content $path -Tail 80) -join "`n"
              for ($offset=0;$offset -lt $value.Length;$offset+=3000) {
                $part = $value.Substring($offset,[Math]::Min(3000,$value.Length-$offset)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output "::notice file=.github/workflows/windows-regression.yml,line=1,title=${{ matrix.configuration }} $file offset=${offset}::$part"
              }
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-${{ matrix.configuration }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-evidence-${{ matrix.configuration }}/
          if-no-files-found: error
          retention-days: 30
